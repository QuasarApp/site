<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="quasarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>:
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="120" rx="10" fill="#0d1117"/>
  <g transform="translate(50, 20)">
    <circle cx="70" cy="70" r="60" fill="none" stroke="url(#quasarGradient)" stroke-width="6" opacity="0.25"/>
    <path d="M 50 50 L 20 20 L 80 20 L 80 60 L 20 60 Z" fill="url(#quasarGradient)" filter="url(#glow)" opacity="0.9"/>
    <circle cx="50" cy="50" r="18" fill="#0d1117" opacity="0.95"/>
    <g fill="url(#quasarGradient)" opacity="0.8">
      <circle cx="40" cy="40" r="5"/>
      <circle cx="60" cy="40" r="5"/>
      <circle cx="50" cy="50" r="5"/>
      <circle cx="40" cy="60" r="5"/>
      <circle cx="60" cy="60" r="5"/>
    </g>
  </g>
  <text x="180" y="75" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#quasarGradient)" letter-spacing="1.5">QuasarApp</text>
</svg>
