name: Auto Tests (PR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  auto-tests:
    name: Lint, type-check, build & auto tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (astro check)
        run: npm run check

      - name: Build (astro build)
        run: npm run build

      - name: Run auto tests
        run: node --test tests/*.test.js

  lighthouse:
    name: Lighthouse (Desktop & Mobile, issue #81)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Start static server
        run: |
          nohup npx -y http-server dist -p 8080 --silent > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null

      - name: Lighthouse Desktop (Performance >= 90)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: 'http://127.0.0.1:8080/'
          configPath: ./lighthouserc.desktop.json
          runs: 1
          temporaryPublicStorage: true
          uploadArtifacts: true
          artifactName: lighthouse-desktop

      - name: Lighthouse Mobile (Performance >= 90)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: 'http://127.0.0.1:8080/'
          configPath: ./lighthouserc.mobile.json
          runs: 1
          temporaryPublicStorage: true
          uploadArtifacts: true
          artifactName: lighthouse-mobile
